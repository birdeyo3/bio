<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ecosystem Quiz</title>
<style>
  :root {
    --green: #00e676;
    --blue: #00b0ff;
    --teal: #1de9b6;
    --purple: #ea80fc;
    --orange: #ffab40;
    --red: #ff5252;
    --bg: #050d1a;
    --glass: rgba(255,255,255,0.07);
    --glass-border: rgba(255,255,255,0.14);
    --text: #e8f5e9;
    --text-muted: #90a4ae;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
  }

  body {
    background: radial-gradient(ellipse at 30% 20%, #0a1f2e 0%, #050d1a 50%, #0a1a12 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  /* Floating particles */
  .particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .leaf {
    position: absolute;
    width: 10px;
    height: 10px;
    background: linear-gradient(135deg, rgba(0,230,118,0.45), rgba(0,176,255,0.25));
    border-radius: 0 70% 0 70%;
    animation: floatLeaf linear infinite;
  }
  @keyframes floatLeaf {
    0%   { transform: translateY(105vh) rotate(0deg); opacity: 0; }
    8%   { opacity: 0.6; }
    92%  { opacity: 0.3; }
    100% { transform: translateY(-10vh) rotate(720deg) translateX(40px); opacity: 0; }
  }

  .container {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 640px;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 28px;
  }
  .header h1 {
    font-size: 2.4rem;
    font-weight: 800;
    background: linear-gradient(105deg, #00e676, #00b0ff, #1de9b6, #ea80fc);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientShift 8s ease infinite;
    margin-bottom: 8px;
  }
  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .header p {
    color: var(--text-muted);
    font-size: 1.05rem;
  }

  /* Progress */
  .progress-bar-wrap {
    height: 8px;
    background: rgba(255,255,255,0.08);
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--green), var(--blue), var(--purple));
    background-size: 200% 100%;
    border-radius: 20px;
    transition: width 0.45s ease;
    animation: progressGlow 3s linear infinite;
  }
  @keyframes progressGlow {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }
  .progress-text {
    text-align: right;
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-bottom: 20px;
  }

  /* Card */
  .card {
    background: var(--glass);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    padding: 32px 28px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  }

  .question-number {
    display: inline-block;
    background: rgba(0,230,118,0.15);
    color: var(--green);
    font-size: 0.8rem;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 14px;
    letter-spacing: 0.5px;
  }

  .question-text {
    font-size: 1.35rem;
    font-weight: 650;
    color: #fff;
    line-height: 1.4;
    margin-bottom: 24px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .option-btn {
    background: rgba(255,255,255,0.05);
    border: 1.5px solid rgba(255,255,255,0.12);
    color: var(--text);
    padding: 16px 20px;
    border-radius: 14px;
    font-size: 1.05rem;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
    transition: all 0.25s ease;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .option-btn:hover:not(:disabled) {
    background: rgba(0,230,118,0.12);
    border-color: rgba(0,230,118,0.4);
    transform: translateX(6px);
  }
  .option-btn:disabled {
    cursor: default;
  }

  .option-letter {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.9rem;
    flex-shrink: 0;
  }

  .option-btn.correct {
    background: rgba(0,230,118,0.2);
    border-color: var(--green);
    color: #fff;
  }
  .option-btn.correct .option-letter {
    background: var(--green);
    color: #050d1a;
  }
  .option-btn.wrong {
    background: rgba(255,82,82,0.18);
    border-color: var(--red);
  }
  .option-btn.wrong .option-letter {
    background: var(--red);
    color: #fff;
  }

  .feedback {
    margin-top: 18px;
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 500;
    display: none;
    animation: fadeIn 0.35s ease;
  }
  .feedback.show { display: block; }
  .feedback.correct {
    background: rgba(0,230,118,0.12);
    border: 1px solid rgba(0,230,118,0.35);
    color: var(--green);
  }
  .feedback.wrong {
    background: rgba(255,82,82,0.12);
    border: 1px solid rgba(255,82,82,0.35);
    color: #ff8a80;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .nav-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 24px;
    gap: 12px;
  }

  .btn {
    border: none;
    padding: 13px 26px;
    border-radius: 40px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--green), var(--blue));
    color: #050d1a;
    box-shadow: 0 4px 18px rgba(0,230,118,0.35);
  }
  .btn-primary:hover {
    transform: scale(1.04);
    box-shadow: 0 6px 24px rgba(0,230,118,0.5);
  }
  .btn-primary:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }
  .btn-ghost {
    background: transparent;
    border: 1.5px solid rgba(255,255,255,0.2);
    color: var(--text-muted);
  }
  .btn-ghost:hover {
    border-color: rgba(255,255,255,0.4);
    color: #fff;
  }

  /* Results screen */
  .results {
    text-align: center;
    display: none;
  }
  .results.show { display: block; animation: fadeIn 0.5s ease; }

  .score-circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: conic-gradient(var(--green) 0%, rgba(255,255,255,0.08) 0%);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    position: relative;
  }
  .score-circle::before {
    content: '';
    position: absolute;
    inset: 10px;
    background: #0a1628;
    border-radius: 50%;
  }
  .score-value {
    position: relative;
    z-index: 2;
    font-size: 2.4rem;
    font-weight: 800;
    color: #fff;
  }
  .score-label {
    font-size: 1.1rem;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .score-message {
    font-size: 1.25rem;
    font-weight: 600;
    color: #fff;
    margin-bottom: 28px;
  }

  .restart-btn {
    background: linear-gradient(135deg, var(--green), var(--blue));
    color: #050d1a;
    border: none;
    padding: 14px 36px;
    border-radius: 40px;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(0,230,118,0.35);
    transition: all 0.25s;
  }
  .restart-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 28px rgba(0,230,118,0.5);
  }

  /* Start screen */
  .start-screen {
    text-align: center;
  }
  .start-screen .emoji {
    font-size: 4rem;
    margin-bottom: 16px;
    display: block;
  }
  .start-screen h2 {
    font-size: 1.6rem;
    margin-bottom: 10px;
    color: #fff;
  }
  .start-screen p {
    color: var(--text-muted);
    margin-bottom: 28px;
    line-height: 1.5;
  }
  .start-btn {
    background: linear-gradient(135deg, var(--green), var(--blue));
    color: #050d1a;
    border: none;
    padding: 16px 42px;
    border-radius: 50px;
    font-size: 1.15rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(0,230,118,0.4);
    transition: all 0.3s;
  }
  .start-btn:hover {
    transform: scale(1.06);
    box-shadow: 0 10px 32px rgba(0,230,118,0.55);
  }

  .hidden { display: none !important; }

  @media (max-width: 520px) {
    .header h1 { font-size: 1.9rem; }
    .question-text { font-size: 1.15rem; }
    .card { padding: 24px 18px; }
    .option-btn { padding: 14px 16px; font-size: 0.95rem; }
  }
</style>
</head>
<body>
  <div class="particles" id="particles"></div>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>🌿 Ecosystem Quiz</h1>
      <p>Test your knowledge of biotic & abiotic components</p>
    </div>

    <!-- Start Screen -->
    <div class="card start-screen" id="startScreen">
      <span class="emoji">🌍</span>
      <h2>Ready to begin?</h2>
      <p>10 questions covering producers, consumers, decomposers, scavengers, energy flow and abiotic factors.</p>
      <button class="start-btn" onclick="startQuiz()">Start Quiz →</button>
    </div>

    <!-- Quiz Screen -->
    <div id="quizScreen" class="hidden">
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="progress-text" id="progressText">Question 1 of 10</div>

      <div class="card">
        <div class="question-number" id="qNumber">Question 1</div>
        <div class="question-text" id="qText"></div>
        <div class="options" id="options"></div>
        <div class="feedback" id="feedback"></div>

        <div class="nav-row">
          <button class="btn btn-ghost" id="prevBtn" onclick="prevQuestion()" disabled>← Prev</button>
          <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" disabled>Next →</button>
        </div>
      </div>
    </div>

    <!-- Results Screen -->
    <div class="card results" id="resultsScreen">
      <div class="score-circle" id="scoreCircle">
        <div class="score-value" id="scoreValue">0</div>
      </div>
      <div class="score-label">Your Score</div>
      <div class="score-message" id="scoreMessage"></div>
      <button class="restart-btn" onclick="restartQuiz()">Try Again 🔄</button>
    </div>
  </div>

<script>
  // Particles
  const particlesContainer = document.getElementById('particles');
  for (let i = 0; i < 22; i++) {
    const leaf = document.createElement('div');
    leaf.className = 'leaf';
    leaf.style.left = Math.random() * 100 + '%';
    leaf.style.animationDuration = (9 + Math.random() * 12) + 's';
    leaf.style.animationDelay = Math.random() * 8 + 's';
    leaf.style.width = (7 + Math.random() * 9) + 'px';
    leaf.style.height = leaf.style.width;
    leaf.style.opacity = 0.2 + Math.random() * 0.4;
    particlesContainer.appendChild(leaf);
  }

  // Quiz data
  const quizData = [
    {
      q: "What are biotic components of an ecosystem?",
      options: ["Non-living factors like sunlight and water", "Living organisms such as plants, animals and microbes", "Only the plants in an area", "Only the animals in an area"],
      correct: 1,
      explain: "Biotic components are all the living organisms in an ecosystem."
    },
    {
      q: "Which organisms make their own food using sunlight?",
      options: ["Consumers", "Decomposers", "Producers", "Scavengers"],
      correct: 2,
      explain: "Producers (like plants and algae) perform photosynthesis to make their own food."
    },
    {
      q: "Earthworms are an example of:",
      options: ["Producers", "Detritivores", "Apex predators", "Abiotic factors"],
      correct: 1,
      explain: "Detritivores eat dead organic matter (detritus) and help break it down."
    },
    {
      q: "Only about ___ % of energy is transferred to the next trophic level.",
      options: ["50%", "25%", "10%", "90%"],
      correct: 2,
      explain: "Roughly 10% of energy moves up each trophic level; the rest is lost as heat."
    },
    {
      q: "Which of these is an abiotic factor?",
      options: ["Fungi", "Deer", "Sunlight", "Bacteria"],
      correct: 2,
      explain: "Sunlight is a non-living (abiotic) factor essential for ecosystems."
    },
    {
      q: "What do scavengers mainly feed on?",
      options: ["Living plants", "Dead animals (carcasses)", "Sunlight", "Soil minerals"],
      correct: 1,
      explain: "Scavengers such as vultures and hyenas feed on dead animals."
    },
    {
      q: "Who are the main decomposers in most ecosystems?",
      options: ["Lions and tigers", "Bacteria and fungi", "Rabbits and deer", "Birds"],
      correct: 1,
      explain: "Bacteria and fungi chemically break down dead matter and recycle nutrients."
    },
    {
      q: "Primary consumers are also known as:",
      options: ["Carnivores", "Herbivores", "Omnivores", "Producers"],
      correct: 1,
      explain: "Primary consumers eat producers (plants), so they are herbivores."
    },
    {
      q: "Which trophic level has the most energy available?",
      options: ["Tertiary consumers", "Secondary consumers", "Primary consumers", "Producers"],
      correct: 3,
      explain: "Producers form the base of the energy pyramid and hold the most energy."
    },
    {
      q: "What happens when temperature becomes extremely high for plants?",
      options: ["They grow faster forever", "They can wilt and die", "They turn into consumers", "Nothing changes"],
      correct: 1,
      explain: "Extreme heat stresses plants, causing them to wilt and potentially die."
    }
  ];

  let current = 0;
  let score = 0;
  let answers = []; // store selected index per question (-1 = unanswered)

  const startScreen   = document.getElementById('startScreen');
  const quizScreen    = document.getElementById('quizScreen');
  const resultsScreen = document.getElementById('resultsScreen');
  const qNumber       = document.getElementById('qNumber');
  const qText         = document.getElementById('qText');
  const optionsEl     = document.getElementById('options');
  const feedbackEl    = document.getElementById('feedback');
  const nextBtn       = document.getElementById('nextBtn');
  const prevBtn       = document.getElementById('prevBtn');
  const progressBar   = document.getElementById('progressBar');
  const progressText  = document.getElementById('progressText');

  function startQuiz() {
    current = 0;
    score = 0;
    answers = new Array(quizData.length).fill(-1);
    startScreen.classList.add('hidden');
    resultsScreen.classList.remove('show');
    quizScreen.classList.remove('hidden');
    showQuestion();
  }

  function showQuestion() {
    const data = quizData[current];
    qNumber.textContent = `Question ${current + 1}`;
    qText.textContent = data.q;
    progressText.textContent = `Question ${current + 1} of ${quizData.length}`;
    progressBar.style.width = ((current + 1) / quizData.length * 100) + '%';

    optionsEl.innerHTML = '';
    feedbackEl.className = 'feedback';
    feedbackEl.textContent = '';

    const letters = ['A', 'B', 'C', 'D'];
    data.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerHTML = `<span class="option-letter">${letters[i]}</span><span>${opt}</span>`;
      btn.onclick = () => selectOption(i);
      optionsEl.appendChild(btn);
    });

    // Restore previous answer if any
    if (answers[current] !== -1) {
      applyAnswerState(answers[current]);
    }

    prevBtn.disabled = current === 0;
    nextBtn.disabled = answers[current] === -1;
    nextBtn.textContent = current === quizData.length - 1 ? 'See Results →' : 'Next →';
  }

  function selectOption(idx) {
    if (answers[current] !== -1) return; // already answered
    answers[current] = idx;
    applyAnswerState(idx);
    nextBtn.disabled = false;
  }

  function applyAnswerState(idx) {
    const data = quizData[current];
    const btns = optionsEl.querySelectorAll('.option-btn');
    btns.forEach((btn, i) => {
      btn.disabled = true;
      if (i === data.correct) btn.classList.add('correct');
      if (i === idx && idx !== data.correct) btn.classList.add('wrong');
    });

    feedbackEl.classList.add('show');
    if (idx === data.correct) {
      feedbackEl.classList.add('correct');
      feedbackEl.textContent = '✓ Correct! ' + data.explain;
      // only count score once
      if (!answers._scored) answers._scored = [];
      if (!answers._scored[current]) {
        score++;
        answers._scored[current] = true;
      }
    } else {
      feedbackEl.classList.add('wrong');
      feedbackEl.textContent = '✗ Not quite. ' + data.explain;
    }
  }

  function nextQuestion() {
    if (current < quizData.length - 1) {
      current++;
      showQuestion();
    } else {
      showResults();
    }
  }

  function prevQuestion() {
    if (current > 0) {
      current--;
      showQuestion();
    }
  }

  function showResults() {
    quizScreen.classList.add('hidden');
    resultsScreen.classList.add('show');

    const percent = Math.round((score / quizData.length) * 100);
    document.getElementById('scoreValue').textContent = score + '/' + quizData.length;

    // Update conic gradient
    const circle = document.getElementById('scoreCircle');
    circle.style.background = `conic-gradient(var(--green) ${percent}%, rgba(255,255,255,0.08) ${percent}%)`;

    let msg = '';
    if (percent === 100) msg = 'Perfect! You are an ecosystem expert! 🌟';
    else if (percent >= 80) msg = 'Excellent work! You really know your stuff. 🌿';
    else if (percent >= 60) msg = 'Good job! A bit more practice and you\'ll master it. 👍';
    else if (percent >= 40) msg = 'Not bad – review the topics and try again. 📚';
    else msg = 'Keep learning! Go through the material once more. 💪';

    document.getElementById('scoreMessage').textContent = msg;
  }

  function restartQuiz() {
    resultsScreen.classList.remove('show');
    startScreen.classList.remove('hidden');
  }

  // Keyboard support
  document.addEventListener('keydown', (e) => {
    if (quizScreen.classList.contains('hidden')) return;
    if (e.key === 'ArrowRight' || e.key === 'Enter') {
      if (!nextBtn.disabled) nextQuestion();
    }
    if (e.key === 'ArrowLeft') {
      if (!prevBtn.disabled) prevQuestion();
    }
    // Number keys 1-4
    if (['1','2','3','4'].includes(e.key) && answers[current] === -1) {
      selectOption(parseInt(e.key) - 1);
    }
  });
</script>
</body>
</html>
